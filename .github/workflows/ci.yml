# CI for PatientDeteriorationMonitor (TS-09). Check names are referenced by branch protection; keep them unchanged. See specs/009-ci-pipeline/contracts/ci-checks.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  dependencies:
    name: Dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      # Any finding fails (pip-audit reports no severity). To accept a risk, add --ignore-vuln <ID> here with the reason and a docs/DECISIONS.md entry.
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
      # High and critical fail; low and moderate are only reported. Dev dependencies are included. npm has no per-advisory ignore: fix with an upgrade or an overrides entry in frontend/package.json, plus a docs/DECISIONS.md entry.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

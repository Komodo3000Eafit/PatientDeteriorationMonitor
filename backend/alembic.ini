# Alembic configuration for the backend (TS-03).
# Run every alembic command from backend/ with the virtual environment active.

[alembic]
# Path to the migration scripts, relative to this file.
script_location = %(here)s/migrations

# Prepended to sys.path so env.py can import the "app" package.
prepend_sys_path = %(here)s

# Use os.pathsep to split path lists (Alembic's default for new projects).
path_separator = os

# There is deliberately no sqlalchemy.url setting.
# The URL comes only from DATABASE_URL through app.db; never put it here.


# Logging configuration, used by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
